<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>麻雀 成績管理（スマホ最適化版）</title>
<style>
  body {
    font-family:"Yu Gothic";
    background:#111;
    color:#f5d76e;
    padding:24px;
    font-size:32px;
  }

  select, input {
    padding:26px;
    margin:12px 0;
    background:#222;
    color:#f5d76e;
    border:3px solid #bfa14a;
    border-radius:16px;
    font-size:36px;
    box-sizing:border-box;
  }

  button {
    padding:28px;
    margin:20px 0;
    background:#bfa14a;
    color:#111;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:16px;
    width:100%;
    font-size:38px;
  }

  table {
    border-collapse:collapse;
    width:100%;
    background:#222;
    margin-top:24px;
    font-size:34px;
  }

  th,td {
    border:2px solid #555;
    padding:20px;
    text-align:center;
  }

  th { background:#333; }

  .clickable {
    cursor:pointer;
    color:#f5d76e;
    font-size:40px;
    font-weight:bold;
  }

  #selectedPlayers span {
    display:inline-block;
    margin-right:20px;
    font-size:36px;
    color:yellow;
  }
</style>
</head>
<body>

<button onclick="location.href='index.html'">
  トップ画面に戻る
</button>

<h1 style="color:red; text-align:center; font-size:44px;">麻雀 成績管理</h1>

<!-- ★ プレイヤー選択（プルダウン1つ＋追加ボタン） -->
<h2 style="font-size:40px;">プレイヤー選択</h2>

<div style="display:flex; gap:18px; align-items:center;">
  <select id="playerSelect" style="flex:2;">
    <option value="">選択してください</option>
  </select>

  <button onclick="addSelectedPlayer()" style="flex:1; min-width:140px;">
    追加
  </button>
</div>

<h3 style="font-size:38px;">選択済みプレイヤー</h3>
<div id="selectedPlayers"></div>

<hr>

<!-- ウマ・役満祝儀 -->
<div style="display:flex; gap:300px; align-items:center;">
  <h2 style="font-size:40px;">ウマ</h2>
  <h2 style="font-size:40px; margin-left:330px;">役満祝儀</h2>
</div>

<div style="display:flex; gap:40px; align-items:center;">
  <div style="display:flex; gap:14px;">
    <input id="uma1" type="number" value="10" style="width:150px;">
    <input id="uma2" type="number" value="5" style="width:150px;">
    <input id="uma3" type="number" value="-5" style="width:150px;">
    <input id="uma4" type="number" value="-10" style="width:150px;">
  </div>

  <div style="margin-left:30px;">
    <input id="yakumanBonus" type="number" value="5" style="width:150px;">
  </div>
</div>

<hr>

<h2 style="font-size:40px;">対局登録</h2>

<div id="scoreInputs"></div>

<button onclick="addMatch()">対局を登録する</button>
<button id="updateBtn" onclick="updateMatch()" style="display:none; background:#66cc66;">
  対局を更新する
</button>

<hr>

<h2 style="font-size:40px;">対局履歴</h2>
<div id="historyTable">
  <table>
    <thead>
      <tr id="historyHeader"></tr>
    </thead>
    <tbody id="historyBody"></tbody>
  </table>
</div>

<hr>

<h2 style="font-size:44px;">成績（合計）</h2>
<div id="totalContainer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDc6f_NEYzJ4kKrkLEfWyGc6Ou3yb7ZTk",
    authDomain: "mahjong-score-85942.firebaseapp.com",
    projectId: "mahjong-score-85942",
    storageBucket: "mahjong-score-85942.firebasestorage.app",
    messagingSenderId: "524280113731",
    appId: "1:524280113731:web:32d9368f9c9e58fb9802f6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>

<script>
let todayData = null;
let editingMatchIndex = null;
let allPlayers = [];

/* ------------------------------
   初期ロード
------------------------------ */
window.onload = async () => {
  const params = new URLSearchParams(location.search);
  const isNew = params.get("new");
  const paramDate = params.get("date");

  /* Firestore からプレイヤー一覧取得 */
  const snapPlayers = await db.collection("players").get();
  allPlayers = snapPlayers.docs.map(doc => doc.data().name);

  /* プルダウンに反映 */
  const sel = document.getElementById("playerSelect");
  allPlayers.forEach(p => {
    sel.innerHTML += `<option value="${p}">${p}</option>`;
  });

  /* 新規 or 既存データ読み込み */
  if (isNew) {
    todayData = {
      date: null,
      players: [],
      matches: [],
      timestamp: null
    };
  } else {
    const doc = await db.collection("mahjong-history").doc(paramDate).get();
    todayData = doc.data();
  }

  renderSelectedPlayers();
  updateScoreInputs();
  showHistory();
};

/* ------------------------------
   プレイヤー追加（プルダウン1つ）
------------------------------ */
function addSelectedPlayer() {
  const val = document.getElementById("playerSelect").value;
  if (!val) {
    alert("プレイヤーを選択してください");
    return;
  }

  if (todayData.players.includes(val)) {
    alert("同じプレイヤーは追加できません");
    return;
  }

  if (todayData.players.length >= 4) {
    alert("プレイヤーは最大4人です");
    return;
  }

  todayData.players.push(val);
  renderSelectedPlayers();
  updateScoreInputs();
}

function renderSelectedPlayers() {
  const area = document.getElementById("selectedPlayers");
  area.innerHTML = todayData.players.map(p => `<span>${p}</span>`).join("");
}

/* ------------------------------
   点数入力欄
------------------------------ */
function updateScoreInputs() {
  const scoreArea = document.getElementById("scoreInputs");
  scoreArea.innerHTML = "";

  todayData.players.forEach(name => {
    scoreArea.innerHTML += `
      <div style="margin-bottom:32px;">
        <strong style="font-size:42px;">${name}</strong>
        <div style="display:flex; gap:70px; align-items:center; margin-top:20px;">
          <input type="number" id="score_${name}" placeholder="素点" style="width:260px;">
          <span style="font-size:38px;">役満回数</span>
          <input type="number" id="yakuman_${name}" value="0" min="0" style="width:260px;">
        </div>
      </div>
    `;
  });
}

/* ------------------------------
   対局登録
------------------------------ */
async function addMatch() {

  if (todayData.players.length !== 4) {
    alert("プレイヤーを4人選択してください");
    return;
  }

  if (!todayData.date) {
    const d = new Date();
    const baseDate =
      `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

    const snap = await db.collection("mahjong-history").get();
    const sameDayDocs = snap.docs.filter(doc => doc.id.startsWith(baseDate));
    const suffix = sameDayDocs.length === 0 ? "" : "_" + sameDayDocs.length;

    todayData.date = baseDate + suffix;
  }

  const uma = [
    Number(uma1.value),
    Number(uma2.value),
    Number(uma3.value),
    Number(uma4.value)
  ];

  const yakuBonus = Number(yakumanBonus.value);

  let scores = todayData.players.map(name => {
    return {
      name,
      score: document.getElementById("score_" + name).value,
      yakuman: Number(document.getElementById("yakuman_" + name).value)
    };
  });

  const active = validateFourPlayers(scores);
  if (!active) return;

  const totalScore = active.reduce((sum, p) => sum + Number(p.score), 0);
  if (totalScore !== 0) {
    alert("合計が0ではありません");
    return;
  }

  let ranked = active.map(p => ({
    name:p.name,
    score:Number(p.score),
    yakuman:p.yakuman
  }));

  ranked.sort((a,b) => b.score - a.score);

  let row = {};

  const yakumanPlayers = ranked.filter(r => r.yakuman > 0);
  const nonYakumanPlayers = ranked.filter(r => r.yakuman === 0);

  ranked.forEach((r, i) => {
    const umaPoint = uma[i] || 0;
    let yakuPoint = 0;

    if (r.yakuman > 0) {
      yakuPoint = yakuBonus * nonYakumanPlayers.length;
    } else {
      yakuPoint = -yakuBonus * yakumanPlayers.length;
    }

    const totalPoint = r.score + umaPoint + yakuPoint;

    row[r.name] = `${r.score}（${totalPoint}）`;
  });

  todayData.matches.push({
    match: todayData.matches.length + 1,
    row
  });

  todayData.timestamp = new Date();
  db.collection("mahjong-history").doc(todayData.date).set(todayData);

  alert("登録しました");
  showHistory();
}

/* ------------------------------
   対局修正
------------------------------ */
function editMatch(index) {
  editingMatchIndex = index;

  const match = todayData.matches[index];

  todayData.players.forEach(name => {
    const r = match.row[name];
    if (!r) return;

    const score = r.match(/^(-?\d+)/)[1];

    document.getElementById("score_" + name).value = score;
    document.getElementById("yakuman_" + name).value = 0;
  });

  updateBtn.style.display = "block";
}

/* ------------------------------
   対局更新
------------------------------ */
function updateMatch() {
  if (editingMatchIndex === null) return;

  const uma = [
    Number(uma1.value),
    Number(uma2.value),
    Number(uma3.value),
    Number(uma4.value)
  ];

  const yakuBonus = Number(yakumanBonus.value);

  let scores = todayData.players.map(name => {
    return {
      name,
      score: document.getElementById("score_" + name).value,
      yakuman: Number(document.getElementById("yakuman_" + name).value)
    };
  });

  const active = validateFourPlayers(scores);
  if (!active) return;

  const totalScore = active.reduce((sum, p) => sum + Number(p.score), 0);
  if (totalScore !== 0) {
    alert("合計が0ではありません");
    return;
  }

  let ranked = active.map(p => ({
    name:p.name,
    score:Number(p.score),
    yakuman:p.yakuman
  }));

  ranked.sort((a,b) => b.score - a.score);

  let row = {};

  const yakumanPlayers = ranked.filter(r => r.yakuman > 0);
  const nonYakumanPlayers = ranked.filter(r => r.yakuman === 0);

  ranked.forEach((r, i) => {
    const umaPoint = uma[i] || 0;
    let yakuPoint = 0;

    if (r.yakuman > 0) {
      yakuPoint = yakuBonus * nonYakumanPlayers.length;
    } else {
      yakuPoint = -yakuBonus * yakumanPlayers.length;
    }

    const totalPoint = r.score + umaPoint + yakuPoint;

    row[r.name] = `${r.score}（${totalPoint}）`;
  });

  todayData.matches[editingMatchIndex].row = row;

  todayData.timestamp = new Date();
  db.collection("mahjong-history").doc(todayData.date).set(todayData);

  alert("更新しました");

  editingMatchIndex = null;
  updateBtn.style.display = "none";

  showHistory();
}

/* ------------------------------
   履歴表示
------------------------------ */
function showHistory() {
  const players = todayData.players;

  historyHeader.innerHTML = "<th>対局</th>";
  players.forEach(name => {
    historyHeader.innerHTML += `<th>${name}</th>`;
  });

  historyBody.innerHTML = "";

  todayData.matches.forEach((h, index) => {
    let tr = `<td class="clickable" onclick="editMatch(${index})">${h.match}</td>`;

    players.forEach(name => {
      const r = h.row[name];
      tr += `<td>${r ? r : "－－"}</td>`;
    });

    historyBody.innerHTML += "<tr>" + tr + "</tr>";
  });

  let totals = {};

  todayData.matches.forEach(h => {
    players.forEach(name => {
      const r = h.row[name];
      if (!r) return;

      const match = r.match(/（(-?\d+)）/);
      const point = match ? Number(match[1]) : 0;

      totals[name] = (totals[name] || 0) + point;
    });
  });

  const ranking = Object.entries(totals)
    .map(([name, total]) => ({ name, total }))
    .sort((a,b) => b.total - a.total);

  totalContainer.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>順位</th>
          <th>プレイヤー</th>
          <th>ポイント</th>
        </tr>
      </thead>
      <tbody>
        ${ranking.map((p,i)=>`
          <tr>
            <td>${i+1}</td>
            <td>${p.name}</td>
            <td>${p.total}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

/* ------------------------------
   参加者4人チェック
------------------------------ */
function validateFourPlayers(scores) {
  scores.forEach(p => {
    p.score = p.score.replace(/[\s　]+/g, "");
  });

  const active = scores.filter(p => p.score !== "" && !isNaN(Number(p.score)));

  if (active.length !== 4) {
    alert("参加者は必ず4人です（素点を入力した4人が参加扱いになります）");
    return null;
  }

  return active;
}
</script>

</body>
</html>
