<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>対局登録（麻雀）</title>
<style>
  body {
    font-family:"Yu Gothic";
    background:#111;
    color:#f5d76e;
    padding:20px;
    font-size:20px;
  }

  h1 {
    text-align:center;
    color:#66cc66;
    font-size:28px;
    margin-bottom:25px;
  }

  input, select {
    width:100%;
    padding:12px;
    margin:10px 0;
    font-size:20px;
    border-radius:8px;
    border:none;
  }

  button {
    width:100%;
    padding:15px;
    margin:12px 0;
    background:#bfa14a;
    color:#111;
    border:none;
    font-weight:bold;
    font-size:22px;
    border-radius:10px;
    cursor:pointer;
  }

  button:hover {
    background:#d4b75a;
  }

  .dangerBtn {
    background:#cc4444;
    color:white;
  }
  .dangerBtn:hover {
    background:#dd5555;
  }

  .matchBox {
    background:#222;
    padding:15px;
    margin:15px 0;
    border-radius:8px;
    border:1px solid #444;
  }
</style>
</head>
<body>

<h1>対局登録</h1>

<div id="main"></div>

<button onclick="addMatch()">対局を追加する</button>
<button onclick="saveAll()">保存する</button>
<button class="dangerBtn" onclick="goHome()">戻る</button>

<script>
let players = [];
let matches = [];
let dateKey = "";

/* ------------------------------
   URLパラメータで新規 or 既存を判定
------------------------------ */
window.onload = () => {
  const params = new URLSearchParams(location.search);

  if (params.get("new") === "1") {
    // 新規作成
    dateKey = new Date().toLocaleString();
    players = ["A","B","C","D"]; // 初期値（後で変更可能）
    matches = [];
    render();
  } else {
    // 既存データ読み込み（Firestore）
    dateKey = params.get("date");
    loadFromFirestore(dateKey);
  }
};

/* ------------------------------
   Firestore から読み込み
------------------------------ */
function loadFromFirestore(dateKey) {
  db.collection("mahjong-history")
    .doc(dateKey)
    .get()
    .then(doc => {
      if (!doc.exists) {
        alert("データが見つかりません");
        return;
      }
      const data = doc.data();
      players = data.players;
      matches = data.matches;
      render();
    });
}

/* ------------------------------
   画面描画
------------------------------ */
function render() {
  const main = document.getElementById("main");
  main.innerHTML = `
    <h2 style="font-size:24px;">日付: ${dateKey}</h2>
    <label>プレイヤー（カンマ区切り）</label>
    <input id="playerInput" value="${players.join(",")}">
  `;

  matches.forEach((m, idx) => {
    main.innerHTML += `
      <div class="matchBox">
        <strong style="font-size:22px;">${idx+1} 回戦</strong><br><br>
        ${players.map(p => `
          <label>${p}</label>
          <input id="m${idx}_${p}" value="${m.row[p] || ""}">
        `).join("")}
      </div>
    `;
  });
}

/* ------------------------------
   対局追加
------------------------------ */
function addMatch() {
  players = document.getElementById("playerInput").value.split(",").map(x => x.trim());
  matches.push({ row:{} });
  render();
}

/* ------------------------------
   Firestore に保存
------------------------------ */
function saveAll() {
  players = document.getElementById("playerInput").value.split(",").map(x => x.trim());

  // 入力値を matches に反映
  matches.forEach((m, idx) => {
    m.row = {};
    players.forEach(p => {
      const v = document.getElementById(`m${idx}_${p}`).value;
      m.row[p] = v;
    });
  });

  // Firestore に保存
  db.collection("mahjong-history")
    .doc(dateKey)
    .set({
      date: dateKey,
      players: players,
      matches: matches,
      timestamp: new Date()
    })
    .then(() => {
      alert("保存しました（クラウド）");
      goHome();
    })
    .catch(err => {
      alert("保存エラー: " + err);
    });
}

/* ------------------------------
   戻る
------------------------------ */
function goHome() {
  location.href = "index.html";
}
</script>

<!-- Firebase SDK -->

</body>
</html>
