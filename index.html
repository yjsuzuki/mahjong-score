<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>麻雀 成績管理（トップ）</title>
<style>
  body {
    font-family:"Yu Gothic";
    background:#111;
    color:#f5d76e;
    padding:24px;
    font-size:32px;
  }

  h1 {
    text-align:center;
    color:red;
    font-size:44px;
    margin-bottom:30px;
  }

  h2 {
    font-size:40px;
    margin:20px 0;
  }

  button {
    width:100%;
    padding:28px;
    margin:20px 0;
    background:#bfa14a;
    color:#111;
    border:none;
    font-weight:bold;
    font-size:38px;
    border-radius:16px;
    cursor:pointer;
  }

  button:hover {
    background:#d4b75a;
  }

  .dangerBtn {
    background:#cc4444;
    color:white;
  }
  .dangerBtn:hover {
    background:#dd5555;
  }

  /* ★★★ 過去の対局一覧：3列＋小さく詰める ★★★ */
  #historyList {
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
  }

  .historyItem {
    background:#222;
    padding:10px;
    border-radius:8px;
    border:2px solid #444;
    font-size:22px;   /* ← 小さくする */
    width:100%;
    box-sizing:border-box;
    line-height:1.3;
  }

  .historyItem strong {
    font-size:24px;   /* ← 日付は少し大きめ */
  }

  .historyItem button {
    margin-top:8px;
    background:#66cc66;
    font-size:20px;   /* ← 小さくする */
    padding:10px;
    border-radius:10px;
  }

  table {
    width:100%;
    background:#222;
    border-collapse:collapse;
    margin-top:20px;
    font-size:34px;
  }

  th,td {
    border:2px solid #555;
    padding:20px;
    text-align:center;
  }

  th {
    background:#333;
  }
</style>
</head>
<body>

<h1>麻雀 成績管理</h1>

<button onclick="createNew()">新しい対局を作成する</button>

<hr style="margin:30px 0;">

<h2>総合成績一覧</h2>
<div id="resultContainer"></div>

<hr style="margin:30px 0;">

<h2>過去の対局一覧</h2>
<div id="historyList"></div>

<hr style="margin:30px 0;">

<button class="dangerBtn" onclick="resetAll()">全データ初期化（完全削除）</button>

<script>
function createNew() {
  location.href = "register.html?new=1";
}

function loadAllFromFirestore() {
  db.collection("mahjong-history")
    .get()
    .then(snapshot => {
      const history = [];
      snapshot.forEach(doc => history.push(doc.data()));

      history.sort((a, b) => {
        const ta = new Date(a.timestamp);
        const tb = new Date(b.timestamp);
        return tb - ta;
      });

      renderAll(history);
    });
}

window.onload = () => {
  loadAllFromFirestore();
};

function renderAll(history) {

  let totals = {};
  let matchCounts = {};

  history.forEach(day => {
    day.matches.forEach(match => {
      Object.keys(match.row).forEach(name => {
        const r = match.row[name];
        if (!r) return;

        const point = Number(r.match(/[（(]([-0-9]+)[）)]/)[1]);
        totals[name] = (totals[name] || 0) + point;

        matchCounts[name] = (matchCounts[name] || 0) + 1;
      });
    });
  });

  const ranking = Object.entries(totals)
    .map(([name, total]) => ({
      name,
      total,
      count: matchCounts[name] || 0
    }))
    .sort((a,b) => {
      if (b.total !== a.total) return b.total - a.total;
      return b.count - a.count;
    });

  if (ranking.length === 0) {
    resultContainer.innerHTML = "<p style='font-size:34px;'>まだ成績がありません</p>";
  } else {
    let html = `
      <table>
        <thead>
          <tr>
            <th>順位</th>
            <th>プレイヤー</th>
            <th>総ポイント</th>
            <th>対局数</th>
          </tr>
        </thead>
        <tbody>
    `;

    ranking.forEach((p,i) => {
      html += `
        <tr>
          <td>${i+1}</td>
          <td>${p.name}</td>
          <td>${p.total}</td>
          <td>${p.count}</td>
        </tr>
      `;
    });

    html += "</tbody></table>";
    resultContainer.innerHTML = html;
  }

  const list = document.getElementById("historyList");
  list.innerHTML = "";

  if (history.length === 0) {
    list.innerHTML = "<p style='font-size:34px;'>まだ対局がありません</p>";
    return;
  }

  history.forEach(h => {
    const div = document.createElement("div");
    div.className = "historyItem";

    div.innerHTML = `
      <strong>${h.date}</strong><br>
      プレイヤー: ${h.players.join(", ")}<br>
      対局数: ${h.matches.length}
      <button onclick="openHistory('${h.date}')">開く</button>
    `;

    list.appendChild(div);
  });
}

function openHistory(date) {
  location.href = "register.html?date=" + date;
}

function resetAll() {
  const pw = prompt("初期化パスワードを入力してください");
  if (pw === null) return;

  if (pw !== "yjsuzuki") {
    alert("パスワードが違います");
    return;
  }

  if (!confirm("本当に全データを削除しますか？")) return;

  db.collection("mahjong-history").get().then(snapshot => {
    snapshot.forEach(doc => doc.ref.delete());
  });

  alert("クラウドの全データを削除しました");
  location.reload();
}
</script>

</body>
</html>
