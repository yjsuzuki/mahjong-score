<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>麻雀スコア管理</title>
<style>
  body {
    font-family:"Yu Gothic";
    background:#111;
    color:#f5d76e;
    padding:20px;
    font-size:20px;
  }

  h1 {
    text-align:center;
    color:#66cc66;
    font-size:28px;
    margin-bottom:25px;
  }

  .item {
    background:#222;
    padding:15px;
    margin:12px 0;
    border-radius:8px;
    border:1px solid #444;
  }

  a {
    color:#bfa14a;
    font-size:22px;
    text-decoration:none;
  }

  a:hover {
    color:#d4b75a;
  }

  button {
    width:100%;
    padding:15px;
    margin:12px 0;
    background:#bfa14a;
    color:#111;
    border:none;
    font-weight:bold;
    font-size:22px;
    border-radius:10px;
    cursor:pointer;
  }

  button:hover {
    background:#d4b75a;
  }
</style>
</head>
<body>

<h1>対局一覧</h1>

<div id="list"></div>

<button onclick="newGame()">新規対局を作成する</button>

<script>
function newGame() {
  location.href = "register.html?new=1";
}
</script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDc6f_NEYzJ4kKrkLEfWyGc6Ou3yb7ZTk",
    authDomain: "mahjong-score-85942.firebaseapp.com",
    projectId: "mahjong-score-85942",
    storageBucket: "mahjong-score-85942.firebasestorage.app",
    messagingSenderId: "524280113731",
    appId: "1:524280113731:web:32d9368f9c9e58fb9802f6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>

<script>
function loadList() {
  db.collection("mahjong-history")
    .orderBy("timestamp", "desc")
    .get()
    .then(snapshot => {
      const list = document.getElementById("list");
      list.innerHTML = "";

      snapshot.forEach(doc => {
        const data = doc.data();

        list.innerHTML += `
          <div class="item">
            <a href="register.html?date=${data.date}">
              ${data.date}
            </a>
          </div>
        `;
      });
    })
    .catch(err => {
      alert("読み込みエラー: " + err);
    });
}

window.onload = loadList;
</script>

</body>
</html>
