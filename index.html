<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>麻雀 成績管理（トップ）</title>
<style>
  body {
    font-family:"Yu Gothic";
    background:#111;
    color:#f5d76e;
    padding:24px;
    font-size:32px;
  }

  h1 {
    text-align:center;
    color:red;
    font-size:44px;
    margin-bottom:30px;
  }

  h2 {
    font-size:40px;
    margin:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  button {
    width:100%;
    padding:28px;
    margin:20px 0;
    background:#bfa14a;
    color:#111;
    border:none;
    font-weight:bold;
    font-size:38px;
    border-radius:16px;
    cursor:pointer;
  }

  button:hover {
    background:#d4b75a;
  }

  .smallBtn {
    width:auto;
    padding:10px 16px;
    font-size:24px;
    background:#bfa14a;
    color:#111;
    border-radius:10px;
    margin-left:20px;
  }

  #resetBtn {
    width:auto;
    padding:12px 18px;
    font-size:20px;
    background:#cc4444;
    color:white;
    border-radius:10px;
  }

  #resetBtn:hover {
    background:#dd5555;
  }

  #historyList {
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
  }

  .historyItem {
    background:none;
    border:none;
    padding:4px 0;
    font-size:22px;
    line-height:1.3;
  }

  .historyItem strong {
    font-size:24px;
  }

  .historyItem button {
    margin-top:8px;
    background:#66cc66;
    font-size:20px;
    padding:10px;
    border-radius:10px;
  }

  #resultContainer table {
    width:100%;
    background:#222;
    border-collapse:collapse;
    margin-top:20px;
    font-size:34px;
  }

  #resultContainer th,
  #resultContainer td {

  }

#playerList div {
  background:#333;

<body>

<h1>麻雀 成績管理</h1>
<p style="text-align:center; font-size:18px; font-weight:bold; color:#f5d76e; margin-top:-10px; line-height:1.4;">
  本サイトに関する不具合や修正のご要望がありましたら、麻雀LINEグループにてお知らせください。確認のうえ、対応いたします。（鈴木）
</p>

<!-- ★ 新しい対局を作成する（今日の日付を渡す） -->
<button onclick="createNew()">新しい対局を作成する</button>

<hr style="margin:30px 0;">

<h2>総合成績一覧</h2>
<div id="resultContainer"></div>

<hr style="margin:30px 0;">

<h2>過去の対局一覧</h2>

<hr style="margin:30px 0;">

<h2>
  役満達成者一覧
  <button class="smallBtn" onclick="addYakuman()">登録</button>
</h2>
<div id="yakumanList"></div><button class="smallBtn" onclick="addYakuman()">登録</button>

<h2 style="font-size:30px;">
  プレイヤー一覧
  <button class="smallBtn" style="font-size:20px;" onclick="addPlayer()">登録</button>
</h2>
<div id="playerList"></div>

<!-- ★ 全データ初期化 ＋ バックアップ ＋ 復元 -->
<div style="display:flex; gap:20px; margin-top:40px;">
  <button id="resetBtn" onclick="resetAll()" style="flex:1;">全データ初期化</button>
  <button onclick="downloadBackup()" class="smallBtn" style="flex:1; font-size:22px; padding:16px;">バックアップ（CSV）</button>
  <button onclick="restoreBackup()" class="smallBtn" style="flex:1; font-size:22px; padding:16px;">復元（CSV）</button>
</div>

<script>
/* ★ 新しい対局を作成する（今日の日付を渡す） */
function createNew() {
  const d = new Date();
  const today =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  location.href = "register.html?new=1&date=" + today;
}

/* ★ Firestore から全データ読み込み */
function loadAllFromFirestore() {

  db.collection("players")
    .get()
    .then(snapshot => {
      const list = document.getElementById("playerList");
      list.innerHTML = "";
      snapshot.forEach(doc => {
        const d = doc.data();
        list.innerHTML += `<div>${d.name}</div>`;
      });
    });

db.collection("mahjong-history")
  .get()
  .then(snapshot => {
    const history = [];
    snapshot.forEach(doc => history.push(doc.data()));

    // ★ date を使って新しい順に並べる（確実に動く）
    history.sort((a, b) => {
      return new Date(b.date) - new Date(a.date);
    });

    renderAll(history);
});

  db.collection("yakuman-achievements")
    .get()
    .then(snapshot => {
      const list = document.getElementById("yakumanList");
      list.innerHTML = "";
      snapshot.forEach(doc => {
        const d = doc.data();
        list.innerHTML += `
          <div>
            <strong>${d.date}</strong>　
            <strong>${d.name}</strong>：${d.yaku}
            ${d.note ? `　（${d.note}）` : ""}
          </div>
        `;
      });
    });
}

window.onload = () => {
  loadAllFromFirestore();
};

/* ★ プレイヤー登録 */
function addPlayer() {
  const name = prompt("プレイヤー名を入力");
  if (!name) return;

  const d = new Date();
  const dateStr =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  db.collection("players").add({
    name,
    date: dateStr,
    timestamp: new Date()
  });

  alert("登録しました");
  loadAllFromFirestore();
}

/* ★ 役満登録（プレイヤーリストから選択） */
function addYakuman() {

  // Firestore から players を取得して、選択用ダイアログを出す
  db.collection("players").get().then(snapshot => {

    const players = [];
    snapshot.forEach(doc => {
      const d = doc.data();
      if (d.name) players.push(d.name);
    });

    if (players.length === 0) {
      alert("プレイヤーが登録されていません");
      return;
    }

    // ダイアログHTML生成
    const html = `
      <div id="yakumanDialog" style="
        position:fixed; top:0; left:0; width:100%; height:100%;
        background:rgba(0,0,0,0.85); color:#f5d76e;
        display:flex; justify-content:center; align-items:center;
        font-size:32px; z-index:9999;
      ">
        <div style="
          background:#222; padding:30px; border-radius:20px;
          border:3px solid #bfa14a; width:80%; max-width:600px;
        ">
          <h2 style="text-align:center; margin-bottom:20px;">役満登録</h2>

          <div style="margin-bottom:20px;">
            <div>プレイヤー</div>
            <select id="yk_player" style="
              width:100%; padding:12px; font-size:28px;
              background:#111; color:#f5d76e; border:2px solid #bfa14a;
            ">
              ${players.map(p => `<option value="${p}">${p}</option>`).join("")}
            </select>
          </div>

          <div style="margin-bottom:20px;">
            <div>役名（例：四暗刻、国士無双など）</div>
            <input id="yk_yaku" type="text" style="
              width:100%; padding:12px; font-size:28px;
              background:#111; color:#f5d76e; border:2px solid #bfa14a;
            ">
          </div>

          <button onclick="saveYakumanFromDialog()" style="
            width:100%; padding:20px; font-size:32px;
            background:#bfa14a; color:#111; border:none; border-radius:12px;
          ">登録する</button>

          <button onclick="document.getElementById('yakumanDialog').remove()" style="
            width:100%; padding:16px; font-size:26px; margin-top:10px;
            background:#444; color:#eee; border:none; border-radius:12px;
          ">キャンセル</button>
        </div>
      </div>
    `;

    document.body.insertAdjacentHTML("beforeend", html);
  });
}

/* ★ 役満登録の保存処理（備考対応） */
function saveYakumanFromDialog() {
  const name = document.getElementById("yk_player").value;
  const yaku = document.getElementById("yk_yaku").value;
  const note = document.getElementById("yk_note").value.trim();

  const d = new Date();
  const dateStr =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  db.collection("yakuman-achievements").add({
    name,
    yaku,
    note,
    date: dateStr,
    timestamp: new Date()
  });

  alert("登録しました");

  document.getElementById("yakumanDialog").remove();
  loadAllFromFirestore();
}

/* ★ 過去の対局を開く */
function openHistory(date) {
  location.href = "register.html?date=" + date;
}

/* ★ renderAll（最新＋年→月→日ツリー構造） */
function renderAll(history) {

  /* ▼ 総合成績 */
  let totals = {};
  let matchCounts = {};

  history.forEach(day => {
    day.matches.forEach(match => {
      Object.keys(match.row).forEach(name => {
        const r = match.row[name];
        if (!r) return;

        const point = Number(r.match(/[（(]([-0-9]+)[）)]/)[1]);
        totals[name] = (totals[name] || 0) + point;

        matchCounts[name] = (matchCounts[name] || 0) + 1;
      });
    });
  });

  const ranking = Object.entries(totals)
    .map(([name, total]) => ({
      name,
      total,
      count: matchCounts[name] || 0
    }))
    .sort((a,b) => {
      if (b.total !== a.total) return b.total - a.total;
      return b.count - a.count;
    });

  let html = `
    <table>
      <thead>
        <tr>
          <th>順位</th>
          <th>プレイヤー</th>
          <th>総ポイント</th>
          <th>対局数</th>
        </tr>
      </thead>
      <tbody>
  `;

  ranking.forEach((p,i) => {
    html += `
      <tr>
        <td>${i+1}</td>
        <td>${p.name}</td>
        <td>${p.total}</td>
        <td>${p.count}</td>
      </tr>
    `;
  });

  html += "</tbody></table>";
  resultContainer.innerHTML = html;

  /* ▼ 過去一覧（ツリー表示） */
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  /* ★ 最新の対局（historyList の外に表示） */
  const latest = history[0];
  const latestDiv = document.createElement("div");
  latestDiv.className = "historyItem";
  latestDiv.style.marginBottom = "20px";

  let dayTotals = {};
  latest.matches.forEach(m => {
    Object.keys(m.row).forEach(name => {
      const r = m.row[name];
      if (!r) return;
      const match = r.match(/（(-?\d+)）/);
      if (!match) return;
      const point = Number(match[1]);
      dayTotals[name] = (dayTotals[name] || 0) + point;
    });
  });

  let dayRanking = Object.entries(dayTotals)
    .map(([name, total]) => ({ name, total }))
    .sort((a,b) => b.total - a.total);

  const rankTextLatest = dayRanking
    .map((p,i) => {
      const medal = i === 0 ? "🥇" :
                    i === 1 ? "🥈" :
                    i === 2 ? "🥉" : "🔹";
      return `${medal}${p.name}（${p.total}）`;
    })
    .join("　");

  latestDiv.innerHTML = `
    <strong style="font-size:26px; color:#f5d76e;">最新の対局</strong><br>
    <span style="white-space:nowrap;">
      <a href="register.html?date=${latest.date}"
         style="color:#7CFC00; font-size:26px; font-weight:bold; text-decoration:none;">
         ${latest.date}
      </a>
      【${rankTextLatest}】
    </span>
  `;

  list.parentNode.insertBefore(latestDiv, list);

  /* ★ 年→月→日 ツリー構造 */
  const grouped = {};

  history.forEach(h => {
    const d = new Date(h.date);
    const year = d.getFullYear();
    const month = d.getMonth() + 1;

    if (!grouped[year]) grouped[year] = {};
    if (!grouped[year][month]) grouped[year][month] = [];
    grouped[year][month].push(h);
  });

  Object.keys(grouped).sort((a,b) => b - a).forEach(year => {

    /* 年（大きく） */
    const yearDetails = document.createElement("details");
    yearDetails.style.marginLeft = "0px";
    yearDetails.innerHTML = `
      <summary style="font-size:26px; color:#f5d76e;">
        ${year}年
      </summary>
    `;

    Object.keys(grouped[year]).sort((a,b) => b - a).forEach(month => {

      /* 月（大きく＋インデント） */
      const monthDetails = document.createElement("details");
      monthDetails.style.marginLeft = "20px";
      monthDetails.innerHTML = `
        <summary style="font-size:22px; color:#ddd;">
          ${month}月
        </summary>
      `;

      grouped[year][month].forEach(h => {

        let dayTotals = {};
        h.matches.forEach(m => {
          Object.keys(m.row).forEach(name => {
            const r = m.row[name];
            if (!r) return;
            const match = r.match(/（(-?\d+)）/);
            if (!match) return;
            const point = Number(match[1]);
            dayTotals[name] = (dayTotals[name] || 0) + point;
          });
        });

        let dayRanking = Object.entries(dayTotals)
          .map(([name, total]) => ({ name, total }))
          .sort((a,b) => b.total - a.total);

        const rankText = dayRanking
          .map((p,i) => {
            const medal = i === 0 ? "🥇" :
                          i === 1 ? "🥈" :
                          i === 2 ? "🥉" : "🔹";
            return `
              <span style="display:inline-block; width:150px;">
                ${medal}${p.name}（${p.total}）
              </span>
            `;
         })
         .join("");

        const div = document.createElement("div");
        div.className = "historyItem";
        div.style.marginLeft = "40px";

        div.innerHTML = `
          <span style="white-space:nowrap;">
              <a href="register.html?date=${h.date}"
                 style="color:#7CFC00; font-weight:bold; text-decoration:none;">
                 ${h.date}
              </a>
            【${rankText}】
          </span>
        `;

        monthDetails.appendChild(div);
      });

      yearDetails.appendChild(monthDetails);
    });

    list.appendChild(yearDetails);
  });
}

/* ★ 全データ初期化 */
function resetAll() {
  const pw = prompt("初期化パスワードを入力してください");
  if (pw === null) return;

  if (pw !== "yjsuzuki") {
    alert("パスワードが違います");
    return;
  }

  if (!confirm("本当に全データを削除しますか？")) return;

  const p1 = db.collection("mahjong-history").get().then(snapshot => {
    const deletes = [];
    snapshot.forEach(doc => deletes.push(doc.ref.delete()));
    return Promise.all(deletes);
  });

  const p2 = db.collection("yakuman-achievements").get().then(snapshot => {
    const deletes = [];
    snapshot.forEach(doc => deletes.push(doc.ref.delete()));
    return Promise.all(deletes);
  });

  const p3 = db.collection("players").get().then(snapshot => {
    const deletes = [];
    snapshot.forEach(doc => deletes.push(doc.ref.delete()));
    return Promise.all(deletes);
  });

  Promise.all([p1, p2, p3]).then(() => {
    alert("クラウドの全データを削除しました");
    location.reload();
  });
}

/* ★ CSVバックアップ */
function downloadBackup() {
  Promise.all([
    db.collection("players").get(),
    db.collection("mahjong-history").get(),
    db.collection("yakuman-achievements").get()
  ]).then(([playersSnap, historySnap, yakuSnap]) => {

    let csv = "type,data\n";

    playersSnap.forEach(doc => {
      csv += `player,${JSON.stringify(doc.data())}\n`;
    });

    historySnap.forEach(doc => {
      csv += `history,${JSON.stringify(doc.data())}\n`;
    });

    yakuSnap.forEach(doc => {
      csv += `yakuman,${JSON.stringify(doc.data())}\n`;
    });

    const d = new Date();
    const timestamp =
      d.getFullYear().toString() +
      String(d.getMonth() + 1).padStart(2, "0") +
      String(d.getDate()).padStart(2, "0") +
      String(d.getHours()).padStart(2, "0") +
      String(d.getMinutes()).padStart(2, "0") +
      String(d.getSeconds()).padStart(2, "0");

    const filename = `mahjong_backup_${timestamp}.csv`;

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();

    URL.revokeObjectURL(url);
  });
}

/* ★ CSV復元 */
function restoreBackup() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".csv";

  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const text = await file.text();
    const lines = text.split("\n").slice(1);

    await deleteAllCollections();

    for (const line of lines) {
      if (!line.trim()) continue;

      const [type, jsonStr] = line.split(/,(.+)/);
      const data = JSON.parse(jsonStr);

      if (type === "player") {
        await db.collection("players").add(data);
      } else if (type === "history") {
        await db.collection("mahjong-history").doc(data.date).set(data);
      } else if (type === "yakuman") {
        await db.collection("yakuman-achievements").add(data);
      }
    }

    alert("復元が完了しました");
    location.reload();
  };

  input.click();
}

async function deleteAllCollections() {
  const collections = ["players", "mahjong-history", "yakuman-achievements"];

  for (const col of collections) {
    const snap = await db.collection(col).get();
    const deletes = snap.docs.map(doc => doc.ref.delete());
    await Promise.all(deletes);
  }
}
</script>
