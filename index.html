<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>麻雀 成績管理（トップ）</title>
<style>
  body {
    font-family:"Yu Gothic";
    background:#111;
    color:#f5d76e;
    padding:24px;
    font-size:32px;
  }

  h1 {
    text-align:center;
    color:red;
    font-size:44px;
    margin-bottom:30px;
  }

  h2 {
    font-size:40px;
    margin:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  button {
    width:100%;
    padding:28px;
    margin:20px 0;
    background:#bfa14a;
    color:#111;
    border:none;
    font-weight:bold;
    font-size:38px;
    border-radius:16px;
    cursor:pointer;
  }

  button:hover {
    background:#d4b75a;
  }

  /* ★ 全データ初期化ボタン（固定しない・小さく） */
  #resetBtn {
    width:auto;
    padding:12px 18px;
    font-size:20px;
    background:#cc4444;
    color:white;
    border-radius:10px;
    margin-top:40px;
  }

  #resetBtn:hover {
    background:#dd5555;
  }

  /* ★★★ 過去の対局一覧：3列＋小さく詰める ★★★ */
  #historyList {
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
  }

  .historyItem {
    background:#222;
    padding:10px;
    border-radius:8px;
    border:2px solid #444;
    font-size:22px;
    width:100%;
    box-sizing:border-box;
    line-height:1.3;
  }

  .historyItem strong {
    font-size:24px;
  }

  .historyItem button {
    margin-top:8px;
    background:#66cc66;
    font-size:20px;
    padding:10px;
    border-radius:10px;
  }

  /* ★★★ 総合成績一覧（崩れ防止） ★★★ */
  #resultContainer table {
    width:100%;
    background:#222;
    border-collapse:collapse;
    margin-top:20px;
    font-size:34px;
  }

  #resultContainer th,
  #resultContainer td {
    border:2px solid #555;
    padding:20px;
    text-align:center;
  }

  #resultContainer th {
    background:#333;
  }

  /* ★ 役満達成者一覧（コンパクト） */
  #yakumanList {
    background:#222;
    padding:12px;
    border-radius:10px;
    border:2px solid #444;
    font-size:26px;
    margin-top:20px;
  }

  #yakumanList div {
    margin-bottom:10px;
  }

  /* 役満登録ボタン（横に小さく） */
  #addYakumanSmallBtn {
    background:#bfa14a;
    font-size:24px;
    padding:10px 16px;
    border-radius:10px;
    width:auto;
    margin-left:20px;
  }
</style>
</head>
<body>

<h1>麻雀 成績管理</h1>

<button onclick="createNew()">新しい対局を作成する</button>

<hr style="margin:30px 0;">

<h2>総合成績一覧</h2>
<div id="resultContainer"></div>

<hr style="margin:30px 0;">

<h2>過去の対局一覧</h2>
<div id="historyList"></div>

<hr style="margin:30px 0;">

<h2>
  役満達成者一覧
  <button id="addYakumanSmallBtn" onclick="addYakuman()">登録</button>
</h2>

<div id="yakumanList"></div>

<!-- ★ 一番下に小さく配置 -->
<button id="resetBtn" onclick="resetAll()">全データ初期化</button>

<script>
function createNew() {
  location.href = "register.html?new=1";
}

/* ------------------------------
   Firestore から全データ読み込み
------------------------------ */
function loadAllFromFirestore() {
  db.collection("mahjong-history")
    .get()
    .then(snapshot => {
      const history = [];
      snapshot.forEach(doc => history.push(doc.data()));

      history.sort((a, b) => {
        const ta = new Date(a.timestamp);
        const tb = new Date(b.timestamp);
        return tb - ta;
      });

      renderAll(history);
    });

  db.collection("yakuman-achievements")
    .get()
    .then(snapshot => {
      const list = document.getElementById("yakumanList");
      list.innerHTML = "";

      snapshot.forEach(doc => {
        const d = doc.data();
        list.innerHTML += `
          <div>
            <strong>${d.date}</strong>　
            <strong>${d.name}</strong>：${d.yaku}
          </div>
        `;
      });
    });
}

window.onload = () => {
  loadAllFromFirestore();
};

/* ------------------------------
   Firestoreデータを画面に描画
------------------------------ */
function renderAll(history) {

  let totals = {};
  let matchCounts = {};

  history.forEach(day => {
    day.matches.forEach(match => {
      Object.keys(match.row).forEach(name => {
        const r = match.row[name];
        if (!r) return;

        const point = Number(r.match(/[（(]([-0-9]+)[）)]/)[1]);
        totals[name] = (totals[name] || 0) + point;

        matchCounts[name] = (matchCounts[name] || 0) + 1;
      });
    });
  });

  const ranking = Object.entries(totals)
    .map(([name, total]) => ({
      name,
      total,
      count: matchCounts[name] || 0
    }))
    .sort((a,b) => {
      if (b.total !== a.total) return b.total - a.total;
      return b.count - a.count;
    });

  let html = `
    <table>
      <thead>
        <tr>
          <th>順位</th>
          <th>プレイヤー</th>
          <th>総ポイント</th>
          <th>対局数</th>
        </tr>
      </thead>
      <tbody>
  `;

  ranking.forEach((p,i) => {
    html += `
      <tr>
        <td>${i+1}</td>
        <td>${p.name}</td>
        <td>${p.total}</td>
        <td>${p.count}</td>
      </tr>
    `;
  });

  html += "</tbody></table>";
  resultContainer.innerHTML = html;

  const list = document.getElementById("historyList");
  list.innerHTML = "";

  history.forEach(h => {
    const div = document.createElement("div");
    div.className = "historyItem";

    div.innerHTML = `
      <strong>${h.date}</strong><br>
      ${h.players.join(", ")}<br>
      対局数: ${h.matches.length}
      <button onclick="openHistory('${h.date}')">開く</button>
    `;

    list.appendChild(div);
  });
}

function openHistory(date) {
  location.href = "register.html?date=" + date;
}

/* ------------------------------
   役満達成者追加（小ボタン）
------------------------------ */
function addYakuman() {
  const name = prompt("役満達成者の名前を入力");
  if (!name) return;

  const yaku = prompt("役名を入力（例：四暗刻、国士無双など）");
  if (!yaku) return;

  const d = new Date();
  const dateStr =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  db.collection("yakuman-achievements").add({
    name,
    yaku,
    date: dateStr,
    timestamp: new Date()
  });

  alert("登録しました");
  loadAllFromFirestore();
}

/* ------------------------------
   Firestore 全削除（完全版）
------------------------------ */
function resetAll() {
  const pw = prompt("初期化パスワードを入力してください");
  if (pw === null) return;

  if (pw !== "yjsuzuki") {
    alert("パスワードが違います");
    return;
  }

  if (!confirm("本当に全データを削除しますか？")) return;

  const p1 = db.collection("mahjong-history").get().then(snapshot => {
    const deletes = [];
    snapshot.forEach(doc => deletes.push(doc.ref.delete()));
    return Promise.all(deletes);
  });

  const p2 = db.collection("yakuman-achievements").get().then(snapshot => {
    const deletes = [];
    snapshot.forEach(doc => deletes.push(doc.ref.delete()));
    return Promise.all(deletes);
  });

  Promise.all([p1, p2]).then(() => {
    alert("クラウドの全データを削除しました");
    location.reload();
  });
}
</script>

</body>
</html>
